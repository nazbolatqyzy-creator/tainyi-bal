<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Рефлексия — Тайный бал</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 18%,#725038 0%,#261018 55%,#10090e 100%);color:#ffe7b6;font-family:Georgia,serif;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 15%,#ffdf9b09 15.1% 15.3%);opacity:.6}.curtain{position:fixed;top:0;width:19vw;height:100vh;background:repeating-linear-gradient(90deg,#410d1c,#761e30 18%,#310b19 33%);box-shadow:0 0 40px #0008;pointer-events:none}.left{left:-11vw;transform:skew(7deg)}.right{right:-11vw;transform:skew(-7deg)}main{position:relative;max-width:1150px;margin:auto;padding:30px 24px 50px;text-align:center}.top{font-size:clamp(16px,2vw,23px);letter-spacing:.15em;text-transform:uppercase;color:#e6c98e}.frame{margin:14px auto 20px;max-width:840px;padding:20px;border:4px double #d9ad5b;border-radius:38px;background:linear-gradient(135deg,#6c1427,#330d19 60%,#681b2b);box-shadow:0 0 0 7px #4a1822,0 0 0 10px #b78c43,0 20px 55px #0009}h1{font-size:clamp(36px,5vw,68px);margin:0;font-style:italic;text-shadow:2px 3px #13060b}p{font-size:clamp(17px,2vw,23px);margin:12px 0}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:28px 0}.choice{border:2px solid #dfb66c;border-radius:20px;background:linear-gradient(#fff0cd,#dcb778);color:#4d1420;min-height:245px;padding:20px 10px;box-shadow:inset 0 0 0 5px #ffffff60,0 12px 25px #0008;cursor:pointer;transition:transform .18s,filter .18s}.choice:hover{transform:translateY(-6px);filter:brightness(1.06)}.choice:active{transform:scale(.97)}.emoji{font-size:56px}.choice strong{display:block;font-size:clamp(20px,2.3vw,29px);min-height:70px;margin:10px 0}.count{font-size:49px;font-weight:bold}.small{font-size:16px}.summary{display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap;font-size:24px;margin:18px 0}.total{font-size:36px;color:#fff1cb}button.action{background:#641627;color:#ffe4ad;border:2px solid #e0b66b;border-radius:100px;padding:12px 25px;font:19px Georgia;cursor:pointer;margin:7px}button.action:hover{background:#8b283b}.footer{font-size:16px;color:#e5cba4}.spark{position:fixed;pointer-events:none;color:#ffd47c;animation:rise .9s ease-out forwards;font-size:28px}@keyframes rise{to{opacity:0;transform:translateY(-80px) scale(1.5)}}@media(max-width:650px){.choices{grid-template-columns:1fr}.choice{min-height:160px}.choice strong{min-height:0}.curtain{display:none}}</style></head><body><div class="curtain left"></div><div class="curtain right"></div><main><div class="top">Л. Н. Толстой · «После бала»</div><div class="frame"><h1>Рефлексия</h1><p>«Моё впечатление от урока»</p><p>Выберите один символ, который отражает ваши ощущения.</p></div><div class="choices"><button class="choice" data-i="0"><div class="emoji">🪭</div><strong>Я всё понял(а)</strong><div class="count" id="c0">0</div><div class="small">учеников</div></button><button class="choice" data-i="1"><div class="emoji">🎻</div><strong>Остались вопросы</strong><div class="count" id="c1">0</div><div class="small">учеников</div></button><button class="choice" data-i="2"><div class="emoji">🕯️</div><strong>Мне нужна помощь</strong><div class="count" id="c2">0</div><div class="small">учеников</div></button></div><div class="summary"><span>Всего ответов:</span><strong class="total" id="total">0</strong><span>из 26 учеников</span></div><div><button class="action" id="undo">↶ Отменить последний выбор</button><button class="action" id="reset">↻ Сбросить счётчики</button><button class="action" id="fullscreen">⛶ На весь экран</button><button class="action" id="sound">🔊 Звук включён</button></div><p class="footer">Каждое нажатие добавляет один голос. Для общего подсчёта нажимайте по одному разу за каждого ученика.</p></main><script>const counts=[0,0,0],history=[];let sound=true;let ctx;function tone(f,d=.14){if(!sound)return;try{ctx??=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(f,ctx.currentTime);g.gain.setValueAtTime(.08,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}catch(e){}}function render(){counts.forEach((v,i)=>document.getElementById('c'+i).textContent=v);document.getElementById('total').textContent=counts.reduce((a,b)=>a+b,0)}document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',e=>{const i=+b.dataset.i;counts[i]++;history.push(i);render();tone([523,659,784][i]);const s=document.createElement('span');s.className='spark';s.textContent='✦';s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';document.body.append(s);setTimeout(()=>s.remove(),900)}));document.getElementById('undo').onclick=()=>{if(history.length){counts[history.pop()]--;render();tone(330)}};document.getElementById('reset').onclick=()=>{if(confirm('Обнулить все голоса?')){counts.fill(0);history.length=0;render();tone(440)}};document.getElementById('fullscreen').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};document.getElementById('sound').onclick=e=>{sound=!sound;e.target.textContent=sound?'🔊 Звук включён':'🔇 Звук выключен';if(sound)tone(660)};render();</script></body></html>
