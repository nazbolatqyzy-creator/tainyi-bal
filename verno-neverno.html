<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Верно — неверно · «Реквием» А. А. Ахматовой</title>
<style>
:root{--gold:#d9b862;--gold2:#f3dc98;--ink:#3a2512}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#04140f}
body{font-family:"Palatino Linotype","Book Antiqua",Palatino,Georgia,"Times New Roman",serif;color:var(--ink)}
button{font-family:inherit}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;
  background:radial-gradient(ellipse at 55% 36%,#18493a 0%,#0e3125 45%,#06170f 100%)}

/* ---------- фон ---------- */
#pt{position:absolute;left:-40px;top:0;width:760px;height:900px;object-fit:cover;filter:grayscale(1) brightness(.66) contrast(1.1);opacity:.78;
  -webkit-mask-image:radial-gradient(ellipse 60% 62% at 48% 46%,#000 42%,transparent 100%);mask-image:radial-gradient(ellipse 60% 62% at 48% 46%,#000 42%,transparent 100%)}
.glow{position:absolute;pointer-events:none;border-radius:50%}
.g1{right:-120px;bottom:-60px;width:760px;height:760px;background:radial-gradient(circle,rgba(255,196,100,.34),transparent 62%);animation:gl 3.2s infinite ease-in-out}
.g2{left:-200px;top:-220px;width:640px;height:640px;background:radial-gradient(circle,rgba(255,200,120,.16),transparent 65%)}
@keyframes gl{0%,100%{opacity:.85}30%{opacity:1}55%{opacity:.78}80%{opacity:.96}}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 52% 45%,transparent 48%,rgba(0,0,0,.66) 100%)}
.table{position:absolute;left:0;right:0;bottom:0;height:96px;background:linear-gradient(#3a2414,#1a0e06);border-top:3px solid #6a4a22;box-shadow:0 -10px 24px rgba(0,0,0,.6)}
.ms{position:absolute;width:150px;height:190px;background:repeating-linear-gradient(180deg,transparent 0 16px,rgba(60,35,10,.38) 16px 17px),linear-gradient(135deg,#e9d6a4,#c8ad74);opacity:.42;box-shadow:0 6px 14px rgba(0,0,0,.6);filter:sepia(.3)}
.ms.a{right:-26px;top:-40px;transform:rotate(14deg)}.ms.b{right:56px;top:-64px;transform:rotate(-8deg);opacity:.3}
.ms.t1{left:560px;bottom:70px;width:210px;height:90px;transform:rotate(-3deg);opacity:.5}
.ms.t2{left:800px;bottom:68px;width:190px;height:80px;transform:rotate(2deg);opacity:.4}
#shelf{position:absolute;left:36px;bottom:94px;width:360px;height:170px}
.bk{position:absolute;bottom:0;border-radius:3px 3px 0 0;box-shadow:inset -4px 0 5px rgba(0,0,0,.45),inset 2px 0 3px rgba(255,255,255,.12)}
.bk::before,.bk::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--gold);opacity:.75}.bk::before{top:12px}.bk::after{bottom:12px}
#ink{position:absolute;left:1346px;bottom:84px;width:120px;height:196px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.7))}

/* свечи */
.candle{position:absolute;bottom:92px;width:58px;display:flex;flex-direction:column;align-items:center}
.candle .wax{width:30px;border-radius:4px 4px 2px 2px;background:linear-gradient(90deg,#d9cba5,#fff6d9 45%,#cdbf97);box-shadow:inset -4px 0 5px rgba(0,0,0,.22)}
.candle .base{width:58px;height:12px;border-radius:50% 50% 8px 8px;background:linear-gradient(#e7c872,#8a6420);box-shadow:0 3px 6px #000}
.candle .stand{width:10px;height:16px;background:linear-gradient(90deg,#8a6420,#f0d78a,#8a6420)}
.candle .wick{width:3px;height:9px;background:#2b1a0c}
.flame{width:20px;height:40px;margin-bottom:-1px;transform-origin:50% 100%;animation:flick 1.3s infinite ease-in-out;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;
  background:radial-gradient(ellipse at 50% 70%,#fff8d0 0%,#ffd45a 40%,#ff8a1c 75%,rgba(255,100,0,0) 100%);box-shadow:0 0 22px 10px rgba(255,170,50,.55),0 0 60px 26px rgba(255,140,30,.25)}
.candle.c2 .flame{animation-duration:1.8s;animation-delay:-.7s}
@keyframes flick{0%{transform:scale(1,1) skewX(0)}20%{transform:scale(.93,1.07) skewX(3deg)}40%{transform:scale(1.05,.95) skewX(-2deg)}60%{transform:scale(.96,1.09) skewX(2deg)}80%{transform:scale(1.03,.97) skewX(-3deg)}100%{transform:scale(1,1) skewX(0)}}

/* ---------- заголовок и счётчики ---------- */
#head{position:absolute;left:460px;width:860px;top:16px;text-align:center;color:var(--gold2)}
#head .t1{font-size:34px;letter-spacing:5px;color:var(--gold);text-shadow:0 2px 6px #000;font-style:italic}
#head .t2{font-size:78px;line-height:1.05;margin:2px 0;font-style:italic;text-shadow:0 0 24px rgba(243,220,152,.35),0 3px 8px #000}
#head .orn{color:var(--gold);letter-spacing:12px;font-size:18px}
.chip{position:absolute;left:36px;padding:7px 22px 9px;border:2px solid var(--gold);border-radius:34px;background:rgba(6,23,16,.82);color:var(--gold2);font-size:26px;box-shadow:0 0 14px rgba(0,0,0,.6)}
.chip b{font-size:32px;color:#fff3c4;margin-left:4px}

/* ---------- пергамент ---------- */
#card{position:absolute;left:460px;top:200px;width:860px;height:540px;filter:drop-shadow(0 12px 18px rgba(0,0,0,.7));transition:filter .4s}
#card.good{filter:drop-shadow(0 0 14px #7dff9a) drop-shadow(0 0 40px rgba(90,255,130,.65)) drop-shadow(0 12px 18px rgba(0,0,0,.7))}
#card.bad{filter:drop-shadow(0 0 14px #ff6a5a) drop-shadow(0 0 40px rgba(255,70,50,.6)) drop-shadow(0 12px 18px rgba(0,0,0,.7))}
#sheet{position:absolute;left:14px;right:14px;top:22px;bottom:22px;background:radial-gradient(ellipse at 25% 15%,#fbf0d2,#ecd9a8 55%,#d6bb82);
  box-shadow:inset 0 0 50px rgba(110,70,20,.5);
  clip-path:polygon(0 1.5%,6% 0,14% 1.2%,25% 0,38% 1.4%,52% 0,66% 1.3%,80% 0,92% 1.2%,100% 0,99.4% 14%,100% 30%,99.2% 48%,100% 66%,99.3% 82%,100% 100%,90% 98.8%,76% 100%,62% 98.7%,48% 100%,34% 98.8%,20% 100%,8% 98.6%,0 100%,.7% 84%,0 66%,.8% 48%,0 30%,.6% 14%)}
.rod{position:absolute;left:0;right:0;height:34px;border-radius:17px;z-index:3;
  background:linear-gradient(180deg,#7a4e1e,#e9c277 28%,#fbe6a8 45%,#c18f3e 70%,#5e3a14);box-shadow:0 6px 10px rgba(0,0,0,.55)}
.rod::before,.rod::after{content:"";position:absolute;top:-4px;width:20px;height:42px;border-radius:8px;background:linear-gradient(90deg,#5e3a14,#f0d078,#5e3a14)}
.rod::before{left:-10px}.rod::after{right:-10px}
.rod.t{top:5px}.rod.b{bottom:5px}
#card.open #sheet{animation:unroll .9s cubic-bezier(.3,.7,.2,1)}
#card.open .rod.t{animation:rt .9s cubic-bezier(.3,.7,.2,1)}
#card.open .rod.b{animation:rb .9s cubic-bezier(.3,.7,.2,1)}
@keyframes unroll{from{clip-path:polygon(0 49%,100% 49%,100% 51%,0 51%)}}
@keyframes rt{from{transform:translateY(244px)}}
@keyframes rb{from{transform:translateY(-244px)}}
#inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 52px;z-index:2}
#card.open #inner{animation:fadeIn .6s .35s backwards}
@keyframes fadeIn{from{opacity:0}}
.meta{font-size:24px;letter-spacing:4px;text-transform:uppercase;color:#7a5428;margin-bottom:12px}
.stmt{font-size:42px;line-height:1.26;font-weight:bold;color:#3a1f0b;margin:0 0 22px}
.ans{display:flex;gap:34px;justify-content:center}
.vb{font-size:36px;font-weight:bold;letter-spacing:1px;cursor:pointer;min-width:270px;height:86px;border-radius:50%/50%;border:4px double #f7e3a6;padding:0 26px;
  box-shadow:0 0 0 2px #5c3d12,0 8px 14px rgba(0,0,0,.55),inset 0 2px 6px rgba(255,255,255,.35);transition:transform .15s,filter .15s}
.vb:hover:not(:disabled){transform:translateY(-2px) scale(1.03);filter:brightness(1.1)}
.vb.yes{color:#f6efc8;background:radial-gradient(ellipse at 35% 25%,#4c8a5e,#235a38 60%,#123a22)}
.vb.no{color:#f8e6d6;background:radial-gradient(ellipse at 35% 25%,#a8453a,#702018 60%,#44120d)}
.vb:disabled{cursor:default;opacity:.5}
.vb.picked{opacity:1;box-shadow:0 0 0 3px #fff2b0,0 0 22px 6px rgba(255,235,150,.7)}
.fb{min-height:44px;margin-top:18px;font-size:29px;font-style:italic;font-weight:bold}
.fb.g{color:#1f6a30}.fb.r{color:#8a241a}
.gold{font-size:31px;letter-spacing:1px;cursor:pointer;color:#2e1a08;height:78px;min-width:360px;padding:0 36px;border-radius:50%/50%;border:4px double #fff2c0;
  background:radial-gradient(ellipse at 35% 25%,#f8e6a8,#d6b05a 60%,#a07a2a);box-shadow:0 0 0 2px #7a5a1c,0 8px 16px rgba(0,0,0,.6),0 0 22px rgba(246,221,142,.35);transition:transform .15s,filter .15s}
.gold:hover{transform:translateY(-2px) scale(1.03);filter:brightness(1.08)}
.gold.hide{visibility:hidden}
.big{font-size:84px;font-weight:bold;color:#6a3a10;line-height:1;margin:6px 0}
.rt{font-size:46px;font-style:italic;color:#4a2a10;margin:0 0 6px}
.rp{font-size:31px;line-height:1.3;margin:4px 0 14px}

/* ---------- настройки ---------- */
#gear{position:fixed;top:10px;right:10px;z-index:9600;font-size:19px;cursor:pointer;color:#4a2c10;background:linear-gradient(#efdfb4,#c9a766);border:2px solid #7a5428;border-radius:22px;padding:8px 18px;box-shadow:0 2px 8px rgba(0,0,0,.6)}
#panel{position:fixed;top:56px;right:10px;z-index:9600;width:370px;display:none;padding:16px 18px 18px;color:#3a2512;
  background:radial-gradient(ellipse at 20% 10%,#f9eccb,#ecd8a6 60%,#d6bb82);border:3px double #8a6420;border-radius:6px 16px 6px 16px;box-shadow:0 10px 30px rgba(0,0,0,.7);font-size:18px}
#panel.show{display:block}
#panel h4{margin:10px 0 6px;font-size:16px;letter-spacing:3px;text-transform:uppercase;color:#7a5428;border-bottom:1px solid #a98a55;padding-bottom:3px}
#panel h4:first-child{margin-top:0}
.row{display:flex;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap}
.pb{font-size:17px;cursor:pointer;color:#4a2c10;background:linear-gradient(#efdfb4,#c9a766);border:2px solid #7a5428;border-radius:20px;padding:6px 14px;box-shadow:0 2px 5px rgba(0,0,0,.4)}
.pb:hover{filter:brightness(1.08)}
.pb.off{background:linear-gradient(#cdbd9b,#a99874);color:#6a5a3a}
.row input[type=range]{flex:1;min-width:110px;accent-color:#7a5428}
.note{font-size:14px;font-style:italic;color:#6a4a28;margin:2px 0}

/* заглушка */
@media (prefers-reduced-motion:reduce){.flame,.g1{animation:none}}
</style>
</head>
<body>
<div id="stage">
  <img id="pt" alt="Портрет А. А. Ахматовой" src="">
  <div class="glow g1"></div><div class="glow g2"></div>
  <div class="ms a"></div><div class="ms b"></div>
  <div class="vig"></div>
  <div class="table"></div>
  <div class="ms t1"></div><div class="ms t2"></div>
  <div id="shelf"></div>
  <svg id="ink" viewBox="0 0 150 230" aria-hidden="true">
    <defs><linearGradient id="gq" x1="0" x2="1"><stop offset="0" stop-color="#efe3c8"/><stop offset="1" stop-color="#8a7a58"/></linearGradient>
    <linearGradient id="gi" x1="0" x2="1"><stop offset="0" stop-color="#2a3a34"/><stop offset=".5" stop-color="#56706a"/><stop offset="1" stop-color="#1a2622"/></linearGradient></defs>
    <path d="M118 6C96 24 70 78 58 150c-2 10 0 14 4 18 4-30 22-92 62-152z" fill="url(#gq)"/>
    <path d="M118 6C112 30 96 70 82 100M110 14c-14 14-24 32-34 56" stroke="#5a4a30" stroke-width="1" fill="none"/>
    <path d="M58 150l-8 40 14-30z" fill="#3a2a1a"/>
    <path d="M26 176h86v10c0 22-6 34-14 40H40c-8-6-14-18-14-40z" fill="url(#gi)"/>
    <ellipse cx="69" cy="176" rx="43" ry="8" fill="#0a1411"/><rect x="48" y="160" width="42" height="18" rx="3" fill="#2a3a34"/>
    <ellipse cx="69" cy="160" rx="21" ry="4" fill="#d9b862"/>
  </svg>
  <div class="candle c1" style="left:1462px"><div class="flame"></div><div class="wick"></div><div class="wax" style="height:130px"></div><div class="stand"></div><div class="base"></div></div>
  <div class="candle c2" style="left:1534px"><div class="flame"></div><div class="wick"></div><div class="wax" style="height:190px"></div><div class="stand"></div><div class="base"></div></div>

  <div id="head">
    <div class="t1">Закрепим наши знания</div>
    <div class="t2">«Верно — неверно»</div>
  </div>
  <div class="chip" style="top:30px">Вопрос: <b id="qn">0</b> / 6</div>
  <div class="chip" style="top:100px">Верных ответов: <b id="cn">0</b></div>

  <div id="card" class="open">
    <div class="rod t"></div>
    <div id="sheet"></div>
    <div id="inner"></div>
    <div class="rod b"></div>
  </div>
</div>

<button id="gear" type="button">Настройки</button>
<div id="panel">
  <h4>Портрет</h4>
  <div class="row"><button class="pb" id="pUp" type="button">Загрузить портрет</button><input type="file" id="pFile" accept="image/*" hidden></div>
  <h4>Фоновая музыка</h4>
  <div class="row"><button class="pb" id="mUp" type="button">Загрузить MP3</button><input type="file" id="mFile" accept="audio/mpeg,.mp3,audio/*" hidden>
    <button class="pb" id="mTog" type="button">Музыка: включена</button></div>
  <div class="row">Громкость <input type="range" id="mVol" min="0" max="1" step="0.01" value="0.35" aria-label="Громкость музыки"></div>
  <h4>Звуковые эффекты</h4>
  <div class="row"><button class="pb" id="sTog" type="button">Звуки: включены</button></div>
  <div class="row">Громкость <input type="range" id="sVol" min="0" max="1" step="0.01" value="0.7" aria-label="Громкость звуков"></div>
  <h4>Файл</h4>
  <div class="row"><button class="pb" id="save" type="button">Сохранить готовую игру</button><button class="pb" id="fs" type="button">Полный экран</button></div>
  <div class="note">Сохранённый файл содержит портрет и музыку внутри и работает без интернета.</div>
</div>

  var SFX = {
    click: function () { tone(1500, 0, 0.06, "triangle", 0.18, 800); tone(420, 0, 0.05, "sine", 0.12); },
    good: function () { bell(1175, 0, 0.2, 1.5); bell(1568, 0.14, 0.16, 1.5); bell(2093, 0.28, 0.1, 1.6); },
    bad: function () { tone(330, 0, 0.16, "triangle", 0.2, 262); tone(247, 0.14, 0.26, "triangle", 0.2, 196); },
    flip: function () { swish(0, 0.32, 3400, 900, 0.5, 0.8); swish(0.1, 0.26, 2600, 700, 0.32, 1.1); swish(0.3, 0.22, 1800, 500, 0.18, 1.2); tone(110, 0, 0.1, "sine", 0.1, 70); },
    fanfare: function () {
      [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) { tone(f, i * 0.16, 0.5, "triangle", 0.22); tone(f * 2, i * 0.16, 0.35, "sine", 0.06); });
      [523.25, 659.25, 783.99, 1046.5].forEach(function (f) { tone(f, 0.72, 1.8, "triangle", 0.15); tone(f, 0.72, 1.8, "sine", 0.12); });
      tone(130.8, 0.72, 1.6, "sine", 0.3, 98); bell(2093, 0.72, 0.1, 2.4); bell(1568, 0.9, 0.08, 2.4);
    }
  };
  /* ловим нажатие сразу (pointerdown), чтобы не было задержки */
  document.addEventListener("pointerdown", function (e) {
    ac();
    var b = e.target.closest ? e.target.closest("button") : null;
    if (b && !b.disabled) SFX.click();
  }, true);
  document.addEventListener("keydown", function (e) {
    if ((e.key === "Enter" || e.key === " ") && e.target.tagName === "BUTTON" && !e.target.disabled) { ac(); SFX.click(); }
  }, true);

  /* ====================== ИГРА ====================== */
  var idx = 0, ok = 0, answered = false;
  function open() { var c = $("card"); c.classList.remove("open"); void c.offsetWidth; c.classList.add("open"); }
  function setGlow(c) { $("card").className = (c ? c + " " : "") + "open"; }

  function startScreen() {
    idx = 0; ok = 0; answered = false;
    $("qn").textContent = "0"; $("cn").textContent = "0";
    $("card").className = "";
    $("inner").innerHTML = '<div class="rt">Закрепим наши знания</div><div class="rp">Шесть утверждений о поэме А. А. Ахматовой «Реквием».<br>Выберите: верно или неверно.</div><button class="gold" id="go" type="button">Начать игру</button>';
    open();
    $("go").onclick = function () { SFX.flip(); showQ(); };
  }
  function showQ() {
    answered = false;
    $("qn").textContent = String(idx + 1);
    $("card").className = "";
    $("inner").innerHTML = '<div class="meta">Утверждение ' + (idx + 1) + " из " + Q.length + '</div><p class="stmt">' + Q[idx].t + '</p>' +
      '<div class="ans"><button class="vb yes" data-v="1" type="button">Верно</button><button class="vb no" data-v="0" type="button">Неверно</button></div>' +
      '<div class="fb" id="fb"></div><button class="gold hide" id="nx" type="button">' + (idx === Q.length - 1 ? "Показать результат" : "Следующий вопрос") + "</button>";
    open();
    Array.prototype.forEach.call(document.querySelectorAll(".vb"), function (b) { b.onclick = function () { answer(b); }; });
    $("nx").onclick = next;
  }
  function answer(b) {
    if (answered) return; answered = true;
    var v = b.getAttribute("data-v") === "1", right = (v === Q[idx].a);
    if (right) { ok++; $("cn").textContent = String(ok); SFX.good(); } else SFX.bad();
    Array.prototype.forEach.call(document.querySelectorAll(".vb"), function (x) { x.disabled = true; });
    b.classList.add("picked");
    $("card").className = (right ? "good" : "bad");
    var fb = $("fb");
    fb.className = "fb " + (right ? "g" : "r");
    fb.textContent = right ? "Верно!" : "Неверно. Правильный ответ: " + (Q[idx].a ? "«Верно»" : "«Неверно»");
    $("nx").classList.remove("hide");
  }
  function next() {
    SFX.flip();
    idx++;
    if (idx >= Q.length) result(); else showQ();
  }
  function result() {
    var pt = ok >= 5 ? 1 : 0;
    $("card").className = "";
    $("inner").innerHTML = '<div class="rt">Итог</div><div class="big">' + ok + " из " + Q.length + '</div>' +
      '<div class="rp">Балл: <b>' + pt + "</b><br>" + (pt ? "Задание выполнено. Вы хорошо поняли поэму." : "Задание не выполнено. Перечитайте «Реквием» и попробуйте снова.") + '</div>' +
      '<button class="gold" id="again" type="button">Начать заново</button>';
    open();
    setTimeout(SFX.fanfare, 200);
    $("again").onclick = function () { SFX.flip(); startScreen(); };
  }

  /* ---------- масштаб 16:9 ---------- */
  function fit() {
    var s = Math.min(innerWidth / 1600, innerHeight / 900), st = $("stage");
    st.style.transform = "scale(" + s + ")";
    st.style.left = ((innerWidth - 1600 * s) / 2) + "px";
    st.style.top = ((innerHeight - 900 * s) / 2) + "px";
  }
  addEventListener("resize", fit); fit();

  /* ---------- книги ---------- */
  (function () {
    var cols = ["#5a1f1f", "#1f3a52", "#3b4d22", "#4a2a5a", "#6a4418", "#7a2c2c", "#25483f"], x = 0, h = "";
    [150, 120, 165, 132, 158, 118, 142, 128, 152].forEach(function (ht, i) {
      var w = 24 + (i * 7) % 15;
      h += '<div class="bk" style="left:' + x + "px;width:" + w + "px;height:" + ht + "px;background:linear-gradient(90deg," + cols[i % 7] + ',#00000066)"></div>'; x += w + 2;
    });
    $("shelf").innerHTML = h;
  })();

  /* ---------- портрет ---------- */
  function setPortrait(u) { PORTRAIT = u; $("pt").src = u; }
  if (PORTRAIT) setPortrait(PORTRAIT);
  $("pUp").onclick = function () { $("pFile").click(); };
  $("pFile").onchange = function (e) {
    var f = e.target.files[0]; if (!f) return;
    var r = new FileReader(); r.onload = function () { setPortrait(r.result); }; r.readAsDataURL(f);
  };

  /* ---------- музыка (отдельно от эффектов) ---------- */
  var audio = new Audio(); audio.loop = true; audio.volume = 0.35;
  var mOn = true;
  function mLabel() { $("mTog").textContent = "Музыка: " + (mOn ? "включена" : "выключена"); $("mTog").classList.toggle("off", !mOn); }
  function mPlay() { if (!MUSIC || !mOn) return; var p = audio.play(); if (p && p.catch) p.catch(function () { var once = function () { if (mOn) audio.play().catch(function () {}); document.removeEventListener("pointerdown", once, true); }; document.addEventListener("pointerdown", once, true); }); }
  function setMusic(u) { MUSIC = u; audio.src = u; mOn = true; mLabel(); mPlay(); }
  $("mUp").onclick = function () { $("mFile").click(); };
  $("mFile").onchange = function (e) {
    var f = e.target.files[0]; if (!f) return;
    var r = new FileReader(); r.onload = function () { setMusic(r.result); }; r.readAsDataURL(f);
  };
  $("mTog").onclick = function () { mOn = !mOn; mLabel(); if (mOn) mPlay(); else audio.pause(); };
  $("mVol").oninput = function () { audio.volume = +this.value; };
  if (MUSIC) { audio.src = MUSIC; mPlay(); }
  mLabel();

  /* ---------- звуки: вкл/выкл и громкость ---------- */
  function sLabel() { $("sTog").textContent = "Звуки: " + (sfxOn ? "включены" : "выключены"); $("sTog").classList.toggle("off", !sfxOn); }
  $("sTog").onclick = function () { sfxOn = !sfxOn; ac(); applyVol(); sLabel(); if (sfxOn) setTimeout(SFX.click, 30); };
  $("sVol").oninput = function () { sfxVol = +this.value; ac(); applyVol(); };
  $("sVol").onchange = function () { SFX.good(); };
  sLabel();

  /* ---------- панель, экран, сохранение ---------- */
  $("gear").onclick = function () { $("panel").classList.toggle("show"); };
  $("fs").onclick = function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else (document.documentElement.requestFullscreen || function () {}).call(document.documentElement);
  };
  $("save").onclick = function () {
    var reM = new RegExp("/\\*@@MUSIC@@\\*/[\\s\\S]*?/\\*@@END@@\\*/");
    var reP = new RegExp("/\\*@@PORTRAIT@@\\*/[\\s\\S]*?/\\*@@PEND@@\\*/");
    var out = SRC.replace(reM, function () { return "/*@@" + "MUSIC@@*/" + JSON.stringify(MUSIC) + "/*@@END" + "@@*/"; })
                 .replace(reP, function () { return "/*@@" + "PORTRAIT@@*/" + JSON.stringify(PORTRAIT) + "/*@@PEND" + "@@*/"; });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([out], { type: "text/html" }));
    a.download = "rekviem-verno-neverno.html";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
  };

  startScreen();
})();
</script>
</body>
</html>
