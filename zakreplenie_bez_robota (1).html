<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Закрепление — Пульт знаний</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#170b3d;font-family:'Trebuchet MS',Arial,sans-serif;color:white}body{display:grid;place-items:center}#stage{width:min(100vw,177.777vh);aspect-ratio:16/9;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 5%,#8765fb 0,#4b2caa 36%,#1a0d51 78%);border:3px solid #b79aff;box-shadow:inset 0 0 80px #d0b2ff55}#stage:before{content:'';position:absolute;inset:0;background:repeating-radial-gradient(ellipse at 50% 110%,transparent 0 60px,#a67aff19 62px 65px);pointer-events:none}.stars{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#fff 1.5px,transparent 2px),radial-gradient(#f7c4ff 1px,transparent 2px);background-size:103px 81px,147px 129px;background-position:17px 9px,50px 42px;opacity:.6}.top{position:absolute;top:3%;left:18%;width:64%;text-align:center;border-radius:50px;background:linear-gradient(180deg,#ffddff,#df9fff 48%,#a45ff3);border:4px solid #fff0ff;box-shadow:0 0 25px #ffb8ff,0 8px 0 #6c279c;padding:.8% 1%;color:#471277;font-size:clamp(16px,3vw,46px);font-weight:1000;text-shadow:1px 2px #fff}#sub{position:absolute;top:17%;left:10%;width:80%;text-align:center;font-size:clamp(11px,1.6vw,26px);color:#fff4c9;font-weight:bold}#console{position:absolute;top:30%;left:7%;width:86%;height:60%;border-radius:9% 9% 15% 15%/18% 18% 20% 20%;background:linear-gradient(140deg,#b68aff,#5937d5 28%,#6e46df 65%,#d09aff);border:7px solid #e7d7ff;box-shadow:0 0 36px #b178ff,inset 0 10px 20px #ffffff66,0 20px 0 #271166}#console:before{content:'';position:absolute;inset:7%;border:3px solid #7eefff;border-radius:40px;box-shadow:0 0 20px #4ce6ff,inset 0 0 25px #6edcff44;pointer-events:none}.buttons{position:absolute;inset:17% 8%;display:flex;justify-content:space-around;align-items:center;gap:2%}.orb{position:relative;width:17%;aspect-ratio:1;border-radius:50%;border:5px solid #ffffffc9;box-shadow:inset -10px -14px 18px #21064e77,inset 7px 9px 15px #ffffffaa,0 9px 0 #2a1265,0 0 25px var(--glow);background:radial-gradient(circle at 30% 25%,#fff9,var(--color) 40%,var(--dark));cursor:pointer;transition:transform .18s,filter .2s;display:grid;place-items:center;font-size:clamp(12px,1.4vw,24px);font-weight:1000;text-shadow:0 2px 3px #21044d;text-align:center;padding:1%}.orb:hover{transform:translateY(-8px) scale(1.07);filter:brightness(1.2)}.orb.done{filter:saturate(.5);opacity:.7}.orb.done:after{content:'✓';position:absolute;top:-10%;right:-5%;background:#16b969;border-radius:50%;padding:2% 8%;border:2px solid white}.orb b{font-size:clamp(25px,4.5vw,75px);display:block}.orb span{font-size:clamp(9px,1.15vw,19px)}.bottom{position:absolute;bottom:3%;width:100%;display:flex;justify-content:center;gap:2%}.pill{border:2px solid #fff;border-radius:30px;background:#522c9f;color:white;padding:.5% 2%;font-size:clamp(10px,1.1vw,18px);cursor:pointer;box-shadow:0 0 12px #a07dff}.pill:hover{background:#7548c8}#counter{position:absolute;top:23%;width:100%;text-align:center;color:#d4fbff;font-size:clamp(12px,1.3vw,22px);font-weight:bold}.panel{position:absolute;inset:0;background:#160b43e8;z-index:4;display:none;align-items:center;justify-content:center;padding:4%}.panel.show{display:flex}.dialog{width:84%;max-height:94%;overflow:auto;border:6px solid #f7d6ff;border-radius:40px;background:linear-gradient(145deg,#7842e4,#34217e);box-shadow:0 0 45px #f6b3ff, inset 0 0 35px #ffffff22;text-align:center;padding:3% 5%;position:relative}.dialog h2{font-size:clamp(19px,2.8vw,43px);margin:0 0 2%;color:#ffe87b}.question{font-size:clamp(19px,2.7vw,44px);font-weight:900;margin:1% 0 3%}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:2%}.answer{min-height:75px;border:3px solid white;border-radius:24px;background:linear-gradient(#fcb3e9,#dc5ec9);color:#41135b;font-weight:900;font-size:clamp(13px,1.9vw,30px);cursor:pointer;padding:3% 2%;box-shadow:0 7px 0 #8d2799}.answer:hover{filter:brightness(1.15)}.answer:disabled{cursor:default}.answer.good{background:linear-gradient(#b7ffbd,#32ce7c);color:#10482b}.answer.bad{background:linear-gradient(#ffc2bd,#ff6b75);color:#661a25}#feedback{min-height:2.2em;font-size:clamp(17px,2vw,33px);font-weight:bold;margin-top:3%}#next{display:none;background:linear-gradient(#fff39c,#ffc44d);border:3px solid white;border-radius:40px;color:#60216d;font-weight:1000;font-size:clamp(15px,1.7vw,27px);padding:1% 5%;cursor:pointer}#finish .dialog{background:linear-gradient(130deg,#ef7ecf,#8056ee,#35b9df)}#finish h2{font-size:clamp(26px,4vw,65px);color:#fff9ac;text-shadow:0 4px 0 #7b268d}#finish p{font-size:clamp(16px,2vw,32px)}#finish button{background:#ffde6b;color:#5b267e;border:3px solid white;border-radius:40px;font-weight:bold;padding:2% 5%;font-size:clamp(16px,2vw,30px);cursor:pointer}#confetti{position:absolute;inset:0;pointer-events:none;z-index:6}#hint{position:absolute;top:92%;width:100%;text-align:center;font-size:clamp(10px,1vw,17px);color:#eadbff}@media(max-width:600px){.answer{min-height:45px;border-radius:12px}.dialog{border-radius:20px}.orb{border-width:2px}#console{border-width:3px}.top{border-width:2px}}
</style></head><body><main id="stage"><div class="stars"></div><div class="top">ЗАКРЕПЛЕНИЕ — ПУЛЬТ ЗНАНИЙ</div><div id="sub">Нажми на светящуюся кнопку и проверь свои знания!</div><div id="counter">Выполнено заданий: 0 / 5</div><div id="console"><div class="buttons" id="buttons"></div></div><div class="bottom"><button class="pill" id="sound">🔊 Звук: вкл.</button><button class="pill" id="reset">↻ Начать заново</button></div><div id="hint">Все профессии хороши!</div><section class="panel" id="quiz"><div class="dialog"><h2 id="qtitle"></h2><div class="question" id="question"></div><div class="answers" id="answers"></div><div id="feedback" aria-live="polite"></div><button id="next">Продолжить ✨</button></div></section><section class="panel" id="finish"><div class="dialog"><h2>🎉 Все профессии хороши! 🎉</h2><p>Молодцы! Вы успешно выполнили все 5 заданий!</p><button id="again">Играть ещё раз</button></div></section><canvas id="confetti"></canvas></main><script>
const qs=[{name:'Угадай профессию',q:'Кто готовит лекарства?',a:['Учитель','Фармацевт','Лётчик'],correct:1},{name:'Закончи предложение',q:'Аяжан мечтает стать ...',a:['Фармацевтом','Поваром','Строителем'],correct:0},{name:'Найди признак',q:'Какой врач?',a:['Летает','Внимательный','Десять'],correct:1},{name:'Выбери местоимение',q:'Учитель объясняет урок. ... помогает детям.',a:['Она','Они','Он'],correct:2},{name:'Главная мысль',q:'Что хотел сказать папа Аяжан?',a:['Нужно стать только врачом.','Все профессии важны, каждый может выбрать свою.','Не нужно выбирать профессию.'],correct:1}];
const colors=[['#ff66c8','#b61e8c','#ff8add'],['#2acfff','#0060bf','#4adfff'],['#ffd943','#d18100','#ffe76d'],['#6fe679','#169651','#8bff9d'],['#bc75ff','#7025b7','#d8a3ff']];const icons=['💊','✈️','⭐','📖','💡'];let done=new Set(),current=-1,locked=false,soundOn=true,ctx;const $=id=>document.getElementById(id);function audio(){if(!soundOn)return null;try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}catch(e){return null}}function beep(freq=600,dur=.13,type='sine',vol=.09){let c=audio();if(!c)return;let o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(freq,c.currentTime);g.gain.setValueAtTime(vol,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+dur)}function melody(ok){if(!soundOn)return;(ok?[660,880,1100]:[330,250]).forEach((f,i)=>setTimeout(()=>beep(f,.2,'sine',.12),i*130))}function speak(s){/* Отключён системный роботизированный синтез речи; звуковые эффекты сохранены. */}function render(){let wrap=$('buttons');wrap.innerHTML='';qs.forEach((q,i)=>{let b=document.createElement('button');b.className='orb'+(done.has(i)?' done':'');b.style.cssText=`--color:${colors[i][0]};--dark:${colors[i][1]};--glow:${colors[i][2]}`;b.innerHTML=`<div><b>${icons[i]}</b><span>Задание ${i+1}</span></div>`;b.setAttribute('aria-label',q.name);b.onclick=()=>openQ(i);wrap.appendChild(b)});$('counter').textContent=`Выполнено заданий: ${done.size} / 5`}function openQ(i){if(done.has(i))return;beep(620);current=i;locked=false;let q=qs[i];$('qtitle').textContent=q.name;$('question').textContent=q.q;$('feedback').textContent='';$('next').style.display='none';$('answers').innerHTML='';q.a.forEach((a,j)=>{let b=document.createElement('button');b.className='answer';b.textContent=String.fromCharCode(1040+j)+') '+a;b.onclick=()=>choose(j,b);$('answers').appendChild(b)});$('quiz').classList.add('show')}function choose(j,b){if(locked)return;let q=qs[current],ok=j===q.correct;if(ok){locked=true;b.classList.add('good');$('feedback').textContent='✨ Правильно! Молодец!';melody(true);speak('Правильно! Молодец!');done.add(current);$('next').style.display='inline-block';$('next').textContent=done.size===5?'Завершить игру 🎉':'Продолжить ✨';[...$('answers').children].forEach(x=>x.disabled=true)}else{b.classList.add('bad');b.disabled=true;$('feedback').textContent='Попробуй ещё раз!';melody(false);speak('Попробуй ещё раз!')}}$('next').onclick=()=>{$('quiz').classList.remove('show');render();if(done.size===5)finish()};function finish(){$('finish').classList.add('show');speak('Отлично! Все команды собраны! Все профессии хороши!');[700,900,1050,1250].forEach((f,i)=>setTimeout(()=>beep(f,.3,'triangle',.13),i*180));confetti()}function reset(){done.clear();$('quiz').classList.remove('show');$('finish').classList.remove('show');render()}$('reset').onclick=reset;$('again').onclick=reset;$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 Звук: вкл.':'🔇 Звук: выкл.';if(soundOn)beep(750)};function confetti(){const c=$('confetti'),s=$('stage'),r=s.getBoundingClientRect();c.width=r.width;c.height=r.height;let g=c.getContext('2d'),p=Array.from({length:150},()=>({x:Math.random()*c.width,y:-Math.random()*c.height,w:3+Math.random()*9,v:1+Math.random()*3,h:Math.random()*360}));let n=0;function draw(){g.clearRect(0,0,c.width,c.height);p.forEach(a=>{a.y+=a.v;a.x+=Math.sin(a.y/40)*.7;g.fillStyle=`hsl(${a.h} 100% 70%)`;g.fillRect(a.x,a.y,a.w,a.w*.6)});if(++n<210)requestAnimationFrame(draw);else g.clearRect(0,0,c.width,c.height)}draw()}render();</script></body></html>
